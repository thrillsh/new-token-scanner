# Triggered by the dashboard's "Track" button via repository_dispatch.
# Adds one new open paper position to data/paper_trades.json and commits it.
# Still simulated-only -- same file ci_check_prices.py already reads/writes.

name: Handle track request

on:
  repository_dispatch:
    types: [watch_token]

concurrency:
  group: repository-data-writes
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add tracked position
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          c = json.loads(os.environ["PAYLOAD"])
          path = "data/paper_trades.json"
          os.makedirs("data", exist_ok=True)
          trades = {"positions": []}
          if os.path.exists(path):
              with open(path) as f:
                  trades = json.load(f)

          def log_event(event_type, details):
              # Same append-only audit trail new_token_scanner.log_event
              # writes to -- duplicated inline here since this step runs
              # as a standalone heredoc script rather than importing the
              # module. Kept in the exact same format/file/path so both
              # writers produce one consistent log.
              entry = {"time": datetime.now(timezone.utc).isoformat(), "event": event_type, **details}
              with open("data/activity_log.jsonl", "a") as f:
                  f.write(json.dumps(entry) + "\n")

          required_fields = ["symbol", "name", "network", "token_address", "price_usd", "reserve_usd", "volume_24h_usd"]
          missing_fields = [field for field in required_fields if c.get(field) is None]
          if missing_fields:
              print(f"Skipping invalid track payload: missing {', '.join(missing_fields)}")
              raise SystemExit(0)

          trades["positions"] = [
              p for p in trades["positions"]
              if p.get("token_address") is not None and p.get("symbol") is not None
              and p.get("network") is not None and p.get("entry_price") is not None
          ]

          already = {p["token_address"] for p in trades["positions"] if p["status"] == "open"}
          if c.get("token_address") in already:
              print("Already tracking this token, skipping.")
          else:
              now = datetime.now(timezone.utc).isoformat()
              trades["positions"].append({
                  "symbol": c.get("symbol"),
                  "name": c.get("name"),
                  "network": c.get("network"),
                  "token_address": c.get("token_address"),
                  "entry_time": now,
                  "entry_price": c.get("price_usd"),
                  "entry_liquidity_usd": c.get("reserve_usd"),
                  "entry_volume_24h_usd": c.get("volume_24h_usd"),
                  "status": "open",
                  "history": [{"time": now, "price": c.get("price_usd"), "pct_change": 0.0}],
                  "alerted_thresholds": [],
              })
              with open(path, "w") as f:
                  json.dump(trades, f, indent=2)
              log_event("track_opened", {
                  "symbol": c.get("symbol"), "network": c.get("network"),
                  "token_address": c.get("token_address"), "entry_price": c.get("price_usd"),
                  "entry_liquidity_usd": c.get("reserve_usd"), "entry_volume_24h_usd": c.get("volume_24h_usd"),
                  "source": "dashboard",
              })
              print(f"Tracked {c.get('symbol')}")
          PY

      - name: Install dependencies
        run: pip install requests

      - name: Immediate price check on the newly tracked token
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          # Runs one real price check right away, in this same workflow run,
          # instead of leaving the position at just its entry snapshot until
          # the next scheduled track-prices.yml tick (up to 5 min later).
          # This is what actually removes the "have to wait for a run to
          # see growth" gap -- Track now produces two real data points
          # (entry + this immediate check) instead of one.
          import json, os
          import sys
          sys.path.insert(0, '.')
          import new_token_scanner as nts

          c = json.loads(os.environ["PAYLOAD"])
          token_address = c.get("token_address")
          network = c.get("network")

          trades = nts.load_paper_trades()
          pos = next((p for p in trades["positions"]
                      if p["token_address"] == token_address and p["status"] == "open"), None)
          if pos is None:
              print("Position not found (shouldn't happen right after adding it) -- skipping immediate check.")
              raise SystemExit(0)

          price = nts.fetch_current_price(network, token_address)
          if price is None:
              print("No price back from this immediate check -- will just wait for the next scheduled run.")
              raise SystemExit(0)

          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).isoformat()
          pct_change = ((price - pos["entry_price"]) / pos["entry_price"]) * 100 if pos["entry_price"] else 0.0
          pos["history"].append({"time": now, "price": price, "pct_change": round(pct_change, 2)})
          nts.save_paper_trades(trades)
          print(f"Immediate check: {pos['symbol']} now at {pct_change:+.2f}% ({price})")
          PY

      - name: Commit if changed
        run: |
          git config user.name "token-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/paper_trades.json data/activity_log.jsonl
          git diff --staged --quiet || git commit -m "Track: ${{ github.event.client_payload.symbol }}"
          git push
